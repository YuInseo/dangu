[package]
name = "mc-server"
version = "0.1.0"
edition = "2024"
description = "프레임워크 없이 tokio만으로 바닥부터 짜는 마인크래프트 Java Edition 26.3 서버"
publish = false

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }

# 테스트도 RSA 키 생성·청크 압축을 하므로, 개발 빌드도 가볍게 최적화합니다.
[profile.dev]
opt-level = 1
