[package]
name = "mc-server"
version = "0.1.0"
edition = "2024"
description = "프레임워크 없이 tokio만으로 바닥부터 짜는 마인크래프트 Java Edition 26.3 서버"
publish = false

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
