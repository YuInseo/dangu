[workspace]
resolver = "3"
members = ["crates/sori-core", "crates/sori-server"]
# 데스크톱 GUI 셸(Tauri)은 WebView 개발 패키지가 있는 곳(CI, 윈도우, 안드로이드)에서만 빌드한다.
default-members = ["crates/sori-core", "crates/sori-server"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
authors = ["Sori"]
rust-version = "1.89"

[workspace.dependencies]
sori-core = { path = "crates/sori-core" }
sori-server = { path = "crates/sori-server" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
tracing = "0.1"
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "net", "signal"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"

# 디코딩과 DSP는 디버그 빌드에서도 빨라야 테스트가 금방 끝난다.
[profile.dev.package."*"]
opt-level = 3
[profile.dev]
opt-level = 1
