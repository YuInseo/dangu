name: modes

# 모드 스위치(modes/) — 플로팅 버튼으로 화면 모드를 바꾸는 안드로이드 앱을 빌드한다.
#
# 빌드한 APK는 두 군데에 올린다.
#   - 이 실행의 아티팩트 (Actions 화면에서 받기)
#   - `modes-latest` 프리릴리스 (매번 덮어쓴다)
on:
  push:
    branches:
      - '**'
    paths:
      - 'modes/**'
      - '.github/workflows/modes.yml'
      - '.github/scripts/modes-e2e.sh'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: modes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modes
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      MODES_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      MODES_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      MODES_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      MODES_VERSION_CODE: ${{ github.run_number }}
      MODES_VERSION_NAME: 0.1.${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 기본 브랜치가 아니어도 캐시를 저장한다 — 기본값(읽기 전용)이면 이 브랜치의 빌드는
      # 매번 Gradle·AGP·라이브러리를 새로 받는다.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # 점수판과 같은 서명 키가 있으면 그걸로 서명한다 — 그래야 새 APK를 지우지 않고
      # 덮어 설치할 수 있다. 없으면 디버그 키인데, 러너마다 새로 만들어지면 덮어 설치가
      # 막히므로 캐시에 붙잡아 둔다.
      - name: 서명 키
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "MODES_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "서명 시크릿이 없어 디버그 키로 서명합니다."
          fi

      - name: 디버그 키 캐시
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: modes-debug-keystore

      - name: 빌드
        run: ./gradlew --no-daemon --build-cache assembleRelease

      # 앱이 켜질 때 이 파일을 보고 새 버전인지 판단한다 (Updater.kt).
      - name: APK 이름 붙이기, 버전 파일
        run: |
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/modes.apk"
          printf '{"versionCode": %s, "versionName": "%s", "apk": "modes.apk"}\n' \
            "$MODES_VERSION_CODE" "$MODES_VERSION_NAME" > "$RUNNER_TEMP/modes-version.json"

      - uses: actions/upload-artifact@v4
        with:
          name: modes-apk
          path: ${{ runner.temp }}/modes.apk

      - name: modes-latest 프리릴리스
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete modes-latest --cleanup-tag --yes || true
          gh release create modes-latest "$RUNNER_TEMP/modes.apk" "$RUNNER_TEMP/modes-version.json" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --latest=false \
            --title "모드 스위치 (최신 빌드)" \
            --notes "브랜치 ${GITHUB_REF_NAME} · ${GITHUB_SHA::7} · 버전 ${MODES_VERSION_NAME}"

  # 진짜 기기처럼 확인한다: 에뮬레이터에 APK를 깔고 켜서 화면·UI 트리·로그를 남긴다.
  # 결과는 `modes-e2e` 프리릴리스에 올라간다 (shot-*.png, ui.xml, logcat.txt).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # 확인용 APK (배포본과 같은 소스, 서명만 디버그 키)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: 확인용 빌드
        working-directory: modes
        run: |
          ./gradlew --no-daemon --build-cache assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../modes.apk

      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 에뮬레이터에서 실행
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          # google_apis 이미지는 확인 도중 GMS가 죽으면서 그 글꼴 제공자를 쓰던 앱까지 끌고 간다.
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/scripts/modes-e2e.sh

      - name: modes-e2e 프리릴리스
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete modes-e2e --cleanup-tag --yes || true
          gh release create modes-e2e e2e/* \
            --target "$GITHUB_SHA" \
            --prerelease \
            --latest=false \
            --title "모드 스위치 에뮬레이터 확인" \
            --notes "${GITHUB_SHA::7}"
