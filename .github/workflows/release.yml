name: release

# APK를 만들고, 내보낼 것이면 릴리스까지 만든다.
#
# 길이 셋이고, 무엇이 나오는지가 각각 다르다.
#
#   기본 브랜치에 푸시  → 판올림한 새 버전으로 릴리스 (앱 업데이트 버튼이 본다)
#   그 밖의 브랜치      → `ci` 프리릴리스 (시험용, 업데이트 버튼은 못 본다)
#   태그 v1.2.3 푸시    → 그 태그 그대로 릴리스
#
# 태그를 손으로 밀 필요가 없어진 게 요점이다. 판올림·태그·릴리스는 아래 "버전 결정"이
# 정하고 CI가 만든다 — 사람이 기억해서 맞춰야 하는 자리가 하나 줄었다.
on:
  push:
    tags:
      - 'v*'
    branches:
      - '**'
  # 손으로 돌릴 때. 판올림 폭을 고를 수 있는 유일한 길이라 minor·major는 여기로 낸다.
  workflow_dispatch:
    inputs:
      bump:
        description: '판올림 폭 (none이면 릴리스 없이 빌드만)'
        type: choice
        default: none
        options: [none, patch, minor, major]

permissions:
  contents: write

# 같은 브랜치에 연달아 밀면 앞의 빌드는 버린다. 안드로이드 빌드는 10분씩 걸리고,
# 두 커밋 전의 APK를 기다릴 이유는 없다. 태그는 ref가 각각 달라 서로 취소하지 않는다.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest

    # 시크릿을 job 환경변수로 한 번에 올린다.
    #
    # `if:` 조건에서는 `secrets` 컨텍스트를 쓸 수 없다 — 워크플로가 아예 파싱되지
    # 않는다. 그래서 여기서 env로 옮기고, 아래 단계들은 `env.X != ''`로 판단한다.
    env:
      GRAFT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      GRAFT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
      GRAFT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      GRAFT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      GRAFT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
      GRAFT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      GRAFT_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      GRAFT_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      GRAFT_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      # 앱이 릴리스를 확인할 저장소. 포크에서도 자기 저장소를 보게 된다.
      GRAFT_PUBLIC_GITHUB_REPO: ${{ github.repository }}
      # 프레임워크를 어디서 가져올지. npm에 올라가면 이 두 단계는 사라지고
      # package.json의 버전 하나로 대체된다.
      FRAMEWORK_REPO: YuInseo/graft

    steps:
      # 태그를 전부 가져온다 — 다음 버전이 "지금까지의 가장 큰 태그 + 1"이라, 얕게
      # 받으면 판올림의 근거가 없다.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 프레임워크는 아직 npm에 없으므로 저장소에서 가져와 파일 의존으로 설치한다.
      # 로컬에서는 워크스페이스가 같은 일을 하므로, 앱의 package.json은 건드리지
      # 않고 CI에서만 경로를 바꿔 끼운다.
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.FRAMEWORK_REPO }}
          path: .framework

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Capacitor가 만든 안드로이드 프로젝트를 Gradle이 빌드한다. JDK 17은
      # 프레임워크가 모든 모듈에 강제하는 바이트코드 수준과 같은 값이다.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      # 이 빌드가 무슨 버전이고, 릴리스로 나갈 것인지.
      #
      # 다음 버전은 저장소에 이미 있는 태그에서 온다. 파일에 적어 두고 사람이 올리는
      # 방식이었다면 "버전 올리는 걸 깜빡한 커밋"이 반드시 생기고, 그러면 앱이 자기
      # 버전을 틀리게 안다. 가장 큰 태그에 1을 더하는 쪽은 깜빡할 자리가 없다.
      - name: 버전 결정
        id: version
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BUMP_INPUT: ${{ inputs.bump }}
        run: |
          set -eu
          BUMP="${BUMP_INPUT:-}"

          # 기본 브랜치에 들어온 것은 내보낼 것으로 본다. 문서만 고친 커밋까지 판을
          # 올리는 게 싫을 때를 위해 커밋 메시지에 [skip release]를 두면 빠진다.
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ]; then
            BUMP="${BUMP:-patch}"
          fi
          if git log -1 --pretty=%B | grep -qiF '[skip release]'; then
            BUMP=none
          fi

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # 손으로 민 태그. 이름이 곧 버전이다.
            VALUE="${GITHUB_REF_NAME#v}"
            TAG="$GITHUB_REF_NAME"
            RELEASE=yes
          elif [ -n "$BUMP" ] && [ "$BUMP" != "none" ]; then
            git fetch --tags --force --quiet
            # `sort -V`라야 1.0.10이 1.0.9보다 뒤에 온다. 문자열 정렬이면 열 번째
            # 패치에서 버전이 거꾸로 가고, 그때부터 업데이트가 영영 안 뜬다.
            LAST=$(git tag -l 'v*' | sed 's/^v//' | sort -V | tail -n1)
            LAST=${LAST:-0.0.0}
            MAJOR=${LAST%%.*}
            REST=${LAST#*.}
            MINOR=${REST%%.*}
            PATCH=${REST#*.}
            PATCH=${PATCH%%[!0-9]*}
            case "$BUMP" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              *)     PATCH=$((PATCH + 1)) ;;
            esac
            VALUE="$MAJOR.$MINOR.$PATCH"
            TAG="v$VALUE"
            RELEASE=yes
          else
            # 시험용 빌드. 릴리스 버전과 섞이지 않는 이름을 준다.
            VALUE="0.0.0-ci.${GITHUB_RUN_NUMBER}"
            TAG=""
            RELEASE=no
          fi

          # 네이티브 껍데기의 지문.
          #
          # 앱은 이 값으로 "이번 릴리스가 APK까지 갈아야 하는 것인지"를 안다. 웹 자산은
          # 여기에 넣지 않는다 — 그건 매번 바뀌고, 매번 바뀌는 값으로는 아무것도 구분할
          # 수 없다. 껍데기를 정하는 것은 graft.config.ts와 mobile/ 아래의 파일들뿐이다.
          NATIVE_KEY=$(
            {
              sha256sum graft.config.ts
              find mobile -type f 2>/dev/null | sort | xargs -r sha256sum
            } | sha256sum | cut -c1-12
          )

          echo "value=$VALUE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "native_key=$NATIVE_KEY" >> "$GITHUB_OUTPUT"
          echo "### $VALUE ${TAG:+($TAG)} · 릴리스: $RELEASE" >> "$GITHUB_STEP_SUMMARY"

      - name: 의존성 설치
        run: |
          npm pkg set dependencies.graft="file:.framework/graft"
          npm install --no-audit --no-fund

      - name: 웹·모바일 페이로드 빌드
        env:
          # 앱이 자기 버전을 아는 유일한 경로. 이 값이 태그와 다르면 업데이트 버튼이
          # 방금 설치한 버전을 계속 "새 버전"이라고 부른다.
          GRAFT_PUBLIC_APP_VERSION: ${{ steps.version.outputs.value }}
        run: node .framework/graft/bin/graft.js build --target mobile --platform android

      # 네이티브 구글 로그인은 이 파일이 있어야 동작한다. 없으면 로그인만 꺼진 채로
      # 앱은 정상 빌드된다 — 그래서 시크릿이 없다고 워크플로를 세우지 않는다.
      - name: google-services.json 배치
        if: env.GOOGLE_SERVICES_JSON != ''
        run: |
          mkdir -p mobile/overlay/android/app
          printf '%s' "$GOOGLE_SERVICES_JSON" > mobile/overlay/android/app/google-services.json

      - name: 안드로이드 프로젝트 생성
        working-directory: .graft/mobile
        run: |
          npm install
          npx cap add android

      # 프로젝트가 생긴 뒤 한 번 더 빌드한다: 권한·오버레이·네이티브 코드는 생성된
      # 프로젝트가 있어야 그 안에 쓰이고, 첫 빌드 때는 아직 없었다.
      - name: 권한·오버레이 적용
        env:
          GRAFT_PUBLIC_APP_VERSION: ${{ steps.version.outputs.value }}
        run: node .framework/graft/bin/graft.js build --target mobile --platform android

      - name: 웹 자산 동기화
        working-directory: .graft/mobile
        run: npx cap sync android

      # 서명 키는 저장소에 두지 않는다. 시크릿에 base64로 넣고 여기서만 되살린다.
      - name: 업로드 키 복원
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "GRAFT_ANDROID_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: APK 빌드
        working-directory: .graft/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      # 서명되지 않은 APK는 안드로이드가 설치를 거부한다 — 그런데 Gradle은 그걸
      # 오류가 아니라 `app-release-unsigned.apk`라는 파일 이름으로만 알린다. 릴리스에
      # 붙고 나서야 "설치가 안 된다"로 발견되므로, 여기서 먼저 세운다.
      - name: 서명 확인
        id: apk
        run: |
          FOUND=$(find .graft/mobile/android -name '*.apk' -path '*release*' | head -n1)
          test -n "$FOUND" || { echo "APK를 찾지 못했습니다"; exit 1; }

          if ! unzip -l "$FOUND" | grep -qiE 'META-INF/.*\.(RSA|DSA|EC)'; then
            echo "::error::APK가 서명되지 않았습니다 ($FOUND). 안드로이드가 설치를 거부합니다."
            echo "ANDROID_KEYSTORE_BASE64 등 서명 시크릿이 설정되어 있는지 확인하세요."
            exit 1
          fi
          # 릴리스로 나가는 APK는 버전이 파일 이름에 남는다. 시험용 빌드는 이름을
          # 고정한다 — `ci` 릴리스가 매번 같은 이름을 덮어써야 옛 APK가 쌓이지 않는다.
          if [ "${{ steps.version.outputs.release }}" = "yes" ]; then
            NAME="billiard-${{ steps.version.outputs.value }}.apk"
          else
            NAME="billiard-ci.apk"
          fi
          cp "$FOUND" "$NAME"
          echo "path=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ steps.apk.outputs.path }}

      # 릴리스에 APK 말고 두 개가 더 붙는다.
      #
      #   www-<버전>.zip   앱이 조용히 받아 다음 실행에 적용하는 웹 자산. 대부분의
      #                    업데이트가 이 파일 하나로 끝난다 — 설치 화면도, 누를 것도 없다.
      #   native-<지문>.txt 껍데기의 지문. 파일을 받지 않고 이름만 보고 알 수 있게 이름에
      #                    적는다. 앱은 자기 지문과 비교해 APK가 필요한지를 정한다.
      - name: 웹 번들과 지문 만들기
        if: steps.version.outputs.release == 'yes'
        run: |
          set -eu
          # zip의 뿌리에 index.html이 있어야 한다. 한 겹 감싸면 플러그인이 빈 화면을 연다.
          (cd .graft/mobile/www && zip -qr "$GITHUB_WORKSPACE/www-${{ steps.version.outputs.value }}.zip" .)
          printf '%s\n' "${{ steps.version.outputs.native_key }}" \
            > "native-${{ steps.version.outputs.native_key }}.txt"
          ls -la www-*.zip native-*.txt

      # 브랜치 빌드도 받을 수 있는 주소를 갖는다.
      #
      # 아티팩트는 로그인한 사람만 받을 수 있는 zip이라, 폰에서 설치해 보려면 PC를 한 번
      # 거쳐야 한다. 프리릴리스로 올리면 링크 하나로 폰에서 바로 받힌다. 그러면서도
      # 업데이트 버튼은 이걸 보지 않는다 — `/releases/latest`는 프리릴리스를 빼고 답하고,
      # 앱은 그 엔드포인트만 묻는다. 시험용 빌드가 남에게 "새 버전"으로 뜨는 일이 없다.
      - name: 개발 빌드 올리기
        if: steps.version.outputs.release != 'yes'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci
          name: 개발 빌드 ${{ steps.version.outputs.value }}
          body: |
            브랜치 `${{ github.ref_name }}`의 최신 빌드입니다. (`${{ github.sha }}`)

            정식 버전이 아닙니다 — 앱의 업데이트 버튼은 이 빌드를 보지 않습니다.
            새 빌드가 올라올 때마다 이 자리의 APK가 교체됩니다.
          prerelease: true
          make_latest: false
          files: ${{ steps.apk.outputs.path }}

      # 태그가 아직 없으면 이 단계가 만든다 — 손으로 밀 필요가 없는 이유가 여기다.
      #
      # 그렇게 생긴 태그가 이 워크플로를 다시 부르지는 않는다. GITHUB_TOKEN으로 일어난
      # 일은 새 워크플로를 깨우지 않는 게 Actions의 규칙이고, 그 덕에 릴리스가 자기
      # 자신을 다시 부르는 고리가 생기지 않는다.
      - name: 릴리스 만들기
        if: steps.version.outputs.release == 'yes'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: v${{ steps.version.outputs.value }}
          # 앱의 업데이트 카드가 이 본문을 그대로 보여 준다.
          generate_release_notes: true
          files: |
            ${{ steps.apk.outputs.path }}
            www-${{ steps.version.outputs.value }}.zip
            native-${{ steps.version.outputs.native_key }}.txt
