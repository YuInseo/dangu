name: gallery

# 갤러리 뷰 앱(gallery/)을 빌드한다. 점수판과는 따로 도는 네이티브 안드로이드 앱이다.
#
# 빌드한 APK는 두 군데에 올린다.
#   - 이 실행의 아티팩트 (Actions 화면에서 받기)
#   - `gallery-latest` 프리릴리스 (휴대폰 브라우저로 바로 받기 좋다, 매번 덮어쓴다)
on:
  push:
    branches:
      - '**'
    paths:
      - 'gallery/**'
      - '.github/workflows/gallery.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gallery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gallery
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      GALLERY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      GALLERY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      GALLERY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GALLERY_VERSION_CODE: ${{ github.run_number }}
      GALLERY_VERSION_NAME: 0.1.${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # 점수판과 같은 서명 키가 있으면 그걸로 서명한다 — 그래야 새 APK를 지우지 않고
      # 덮어 설치할 수 있다. 없으면 디버그 키인데, 러너마다 새로 만들어지면 덮어 설치가
      # 막히므로 캐시에 붙잡아 둔다.
      - name: 서명 키
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "GALLERY_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "서명 시크릿이 없어 디버그 키로 서명합니다."
          fi

      - name: 디버그 키 캐시
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: gallery-debug-keystore

      - name: 빌드
        run: ./gradlew --no-daemon assembleRelease

      # 앱이 켜질 때 이 파일을 보고 새 버전인지 판단한다 (data/Updater.kt).
      - name: APK 이름 붙이기, 버전 파일
        run: |
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/gallery-view.apk"
          printf '{"versionCode": %s, "versionName": "%s", "apk": "gallery-view.apk"}\n' \
            "$GALLERY_VERSION_CODE" "$GALLERY_VERSION_NAME" > "$RUNNER_TEMP/gallery-version.json"

      - uses: actions/upload-artifact@v4
        with:
          name: gallery-view-apk
          path: ${{ runner.temp }}/gallery-view.apk

      - name: gallery-latest 프리릴리스
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete gallery-latest --cleanup-tag --yes || true
          gh release create gallery-latest "$RUNNER_TEMP/gallery-view.apk" "$RUNNER_TEMP/gallery-version.json" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --latest=false \
            --title "갤러리 뷰 (최신 빌드)" \
            --notes "브랜치 ${GITHUB_REF_NAME} · ${GITHUB_SHA::7} · 버전 ${GALLERY_VERSION_NAME}"
