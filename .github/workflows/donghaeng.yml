name: donghaeng

# 동행(donghaeng/)의 APK를 만든다.
#
# 당구 점수판과 같은 저장소에 살지만 릴리스는 섞지 않는다. 점수판의 업데이트 버튼은
# `/releases/latest`와 `v*` 태그를 보므로, 동행은 그 둘을 건드리지 않고 `donghaeng-ci`
# 프리릴리스 한 자리에만 올린다. 앱의 자동 업데이트(donghaeng/lib/update.ts)가 이 자리를 본다:
#
#   donghaeng-ci.apk     껍데기. 네이티브가 바뀐 판에서만 앱이 설치를 권한다
#   donghaeng-www.zip    화면. 앱이 조용히 받아 다음 실행에 적용한다
#   릴리스 이름의 버전   0.1.<빌드 번호>. 앱이 자기 버전과 비교한다
#   릴리스 본문 native:  껍데기 지문. 앱이 자기 것과 비교해 APK가 필요한지 정한다
#
# `donghaeng` 브랜치에서만 짓는다. 여러 브랜치가 같은 자리에 올리면 앱이 어느 판을
# 받을지 브랜치마다 오락가락한다.
on:
  push:
    branches:
      - donghaeng
    paths:
      - 'donghaeng/**'
      - '.github/workflows/donghaeng.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: donghaeng-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      # Firebase 설정은 donghaeng/graft.config.ts에 적힌 동행 프로젝트(motion-8b939) 값을 쓴다.
      # 저장소의 FIREBASE_* 시크릿은 당구 점수판 프로젝트의 것이라 여기서 넘기지 않는다.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      GRAFT_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      GRAFT_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      GRAFT_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      # 빌드 번호가 곧 판이다. 앱의 업데이트 비교와 안드로이드 versionCode가 이 값에서 나온다.
      GRAFT_PUBLIC_APP_VERSION: 0.1.${{ github.run_number }}
      GRAFT_PUBLIC_GITHUB_REPO: ${{ github.repository }}

    defaults:
      run:
        working-directory: donghaeng

    steps:
      - uses: actions/checkout@v4

      # 프레임워크는 아직 npm에 없으므로 저장소에서 가져와 파일 의존으로 설치한다.
      - uses: actions/checkout@v4
        with:
          repository: YuInseo/graft
          # 앱 폴더 안에 둔다. 프레임워크가 import하는 esbuild 등은 donghaeng/node_modules에
          # 설치되므로, 프레임워크가 그 위쪽에 있어야 찾는다.
          path: donghaeng/.framework

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 안드로이드 SDK는 ubuntu 러너에 이미 깔려 있다(ANDROID_HOME). setup-android@v3는
      # 기본으로 없어진 `tools` 패키지를 설치하려다 실패하므로 쓰지 않는다.
      - name: 안드로이드 SDK 확인
        run: |
          test -n "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" || { echo "::error::ANDROID_HOME이 없습니다"; exit 1; }
          echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

      - name: Gradle 캐시
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-donghaeng-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            gradle-donghaeng-${{ runner.os }}-
            gradle-${{ runner.os }}-

      # 네이티브 껍데기의 지문. 껍데기를 정하는 것은 graft.config.ts와 mobile/뿐이다 —
      # 화면 코드는 여기 넣지 않는다. 매번 바뀌는 값으로는 아무것도 구분할 수 없다.
      - name: 껍데기 지문
        run: |
          KEY=$( { sha256sum graft.config.ts; find mobile -type f | sort | xargs -r sha256sum; } | sha256sum | cut -c1-12 )
          echo "GRAFT_PUBLIC_NATIVE_KEY=$KEY" >> "$GITHUB_ENV"
          echo "### 동행 ${GRAFT_PUBLIC_APP_VERSION} · native $KEY" >> "$GITHUB_STEP_SUMMARY"

      - name: 의존성 설치
        run: |
          npm pkg set dependencies.graft="file:.framework/graft"
          npm install --no-audit --no-fund

      - name: 웹·모바일 페이로드 빌드
        run: node .framework/graft/bin/graft.js build --target mobile --platform android

      - name: 안드로이드 프로젝트 생성
        working-directory: donghaeng/.graft/mobile
        run: |
          # 업데이터 플러그인을 못박는다. 최신 6.x는 compileSdk 35를 요구하는데 이 앱은
          # 34다(당구 점수판의 release.yml과 같은 이유). 6.13.2가 34에서 지어지는 마지막 판이다.
          npm pkg set "dependencies.@capgo/capacitor-updater=6.13.2"
          npm install
          if [ -d android ] && [ ! -f android/app/build.gradle ]; then
            rm -rf android
          fi
          npx cap add android

      # 프로젝트가 생긴 뒤 한 번 더: 권한·오버레이는 생성된 프로젝트 안에 쓰인다.
      - name: 권한·오버레이 적용
        run: node .framework/graft/bin/graft.js build --target mobile --platform android

      # 구글 로그인 플러그인은 `rgcfaIncludeGoogle`이 켜져 있어야 구글 라이브러리를 넣는다.
      # 꺼진 채로 지으면 앱은 뜨지만 로그인 버튼이 "Google 제공자가 없다"로 끝난다.
      - name: 구글 로그인 켜기
        working-directory: donghaeng/.graft/mobile/android
        run: |
          if ! grep -q rgcfaIncludeGoogle variables.gradle; then
            sed -i 's/^ext {/ext {\n    rgcfaIncludeGoogle = true/' variables.gradle
          fi
          grep -n rgcfaIncludeGoogle variables.gradle

      - name: 웹 자산 동기화
        working-directory: donghaeng/.graft/mobile
        run: npx cap sync android

      - name: 업로드 키 복원
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "GRAFT_ANDROID_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: APK 빌드
        working-directory: donghaeng/.graft/mobile/android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --parallel --build-cache

      - name: 서명 확인
        id: apk
        run: |
          FOUND=$(find .graft/mobile/android -name '*.apk' -path '*release*' | head -n1)
          test -n "$FOUND" || { echo "APK를 찾지 못했습니다"; exit 1; }
          if ! unzip -l "$FOUND" | grep -qiE 'META-INF/.*\.(RSA|DSA|EC)'; then
            echo "::error::APK가 서명되지 않았습니다 ($FOUND). ANDROID_KEYSTORE_BASE64 등 서명 시크릿을 확인하세요."
            exit 1
          fi
          cp "$FOUND" "$GITHUB_WORKSPACE/donghaeng-ci.apk"

      # 화면만 담은 zip. 뿌리에 index.html이 있어야 한다 — 한 겹 감싸면 업데이터가 빈 화면을 연다.
      - name: 웹 번들 묶기
        run: (cd .graft/mobile/www && zip -qr "$GITHUB_WORKSPACE/donghaeng-www.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: donghaeng-apk
          path: donghaeng-ci.apk

      - name: 개발 빌드 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: donghaeng-ci
          name: 동행 ${{ env.GRAFT_PUBLIC_APP_VERSION }}
          body: |
            동행 앱의 최신 빌드입니다. 브랜치 `${{ github.ref_name }}` (`${{ github.sha }}`)

            처음 설치할 때만 `donghaeng-ci.apk`를 받으면 됩니다. 그다음부터는 앱이 스스로
            업데이트합니다. 패키지 이름은 `com.donghaeng.app`이라 당구 점수판과 같이 깔립니다.

            native: ${{ env.GRAFT_PUBLIC_NATIVE_KEY }}
          prerelease: true
          make_latest: false
          files: |
            donghaeng-ci.apk
            donghaeng-www.zip
