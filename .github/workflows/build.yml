name: build

on:
  push:
    branches: [sori]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  TAURI: node ../../ui/node_modules/@tauri-apps/cli/tauri.js

jobs:
  test:
    name: 시험 (리눅스)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: ffmpeg (시험용 음악을 만들고 결과를 맞춰 본다)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: 화면
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          npx vite build
      - name: 시험용 라이브러리
        run: node ui/scripts/make-sample-library.mjs --short
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p sori-core -p sori-server --all-targets -- -D warnings
      - run: cargo test -p sori-core -p sori-server
        env:
          SORI_REQUIRE_SAMPLES: '1'
      - name: 리눅스 서버 실행 파일
        run: cargo build --release -p sori-server
      - uses: actions/upload-artifact@v4
        with:
          name: sample-music
          path: music
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: Sori-linux-server
          path: target/release/sori

  windows:
    name: 윈도우 앱
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows
      - name: 화면
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund
          npx vite build
      - name: 앱 (설치 파일)
        working-directory: crates/sori-app
        shell: bash
        run: $TAURI build --ci
      - name: 서버 실행 파일
        run: cargo build --release -p sori-server
      - uses: actions/upload-artifact@v4
        with:
          name: Sori-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/sori.exe
      - uses: actions/download-artifact@v4
        with:
          name: sample-music
          path: music
      - name: 앱을 띄워 화면 찍기
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force "$env:USERPROFILE\Music" | Out-Null
          Copy-Item -Recurse -Force "music\Sori Samples" "$env:USERPROFILE\Music\"
          Start-Process "target\release\sori-app.exe"
          Start-Sleep -Seconds 25
          try { (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:4380/api/library).Content } catch { "서버에 닿지 않음: $_" }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          New-Item -ItemType Directory -Force shots | Out-Null
          $bmp.Save("shots\windows-1.png")
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-shots
          path: shots
          if-no-files-found: ignore

  android:
    name: 안드로이드 앱
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - name: 화면
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund
          npx vite build
      - name: NDK
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - name: 안드로이드 프로젝트
        working-directory: crates/sori-app
        run: $TAURI android init --ci
      - run: python3 ci/android-patch.py crates/sori-app/gen/android
      - name: APK
        working-directory: crates/sori-app
        run: $TAURI android build --apk --target aarch64 --target x86_64 --ci
      - name: 서명
        run: |
          APK=$(find crates/sori-app/gen/android/app/build/outputs/apk -name '*release*.apk' | head -1)
          echo "APK: $APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          keytool -genkeypair -keystore sori.jks -alias sori -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass soripass -keypass soripass -dname "CN=Sori"
          "$BT/zipalign" -p -f 4 "$APK" aligned.apk
          "$BT/apksigner" sign --ks sori.jks --ks-pass pass:soripass --key-pass pass:soripass --out Sori.apk aligned.apk
          "$BT/apksigner" verify Sori.apk
          ls -la Sori.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Sori-android
          path: Sori.apk

  android-screens:
    name: 안드로이드 화면 (에뮬레이터)
    runs-on: ubuntu-latest
    needs: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Sori-android
      - uses: actions/download-artifact@v4
        with:
          name: sample-music
          path: music
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        continue-on-error: true
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash ci/android-screens.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-shots
          path: shots
          if-no-files-found: ignore
