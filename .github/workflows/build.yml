name: build

on:
  push:
    branches: [sori]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # 앱이 자기 빌드를 안다(자동 업데이트가 릴리스의 latest.json과 견준다).
  SORI_BUILD: ${{ github.sha }}
  # 사람이 부르는 빌드 번호("18번"). 앱과 latest.json이 함께 보인다.
  SORI_BUILD_NUMBER: ${{ github.run_number }}

jobs:
  test:
    name: 시험 (리눅스)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: ffmpeg (시험용 음악을 만들고 결과를 맞춰 본다)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: 화면
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          npx vite build
      - name: 시험용 라이브러리
        run: node ui/scripts/make-sample-library.mjs --short
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p sori-core -p sori-server --all-targets -- -D warnings
      - run: cargo test -p sori-core -p sori-server
        env:
          SORI_REQUIRE_SAMPLES: '1'
      - name: 리눅스 서버 실행 파일
        run: cargo build --release -p sori-server
      - uses: actions/upload-artifact@v4
        with:
          name: sample-music
          path: music
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: Sori-linux-server
          path: target/release/sori

  windows:
    name: 윈도우 앱
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: 빌드 시각
        shell: bash
        run: echo "SORI_BUILD_TIME=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows
      - name: 화면
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund
          npx vite build
      - name: 앱 (설치 파일)
        working-directory: crates/sori-app
        shell: bash
        run: npm run tauri -- build --ci
      - name: 서버 실행 파일
        run: cargo build --release -p sori-server
      - uses: actions/upload-artifact@v4
        with:
          name: Sori-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/sori.exe
      - uses: actions/download-artifact@v4
        with:
          name: sample-music
          path: music
      - name: 앱을 띄워 화면 찍기
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force "$env:USERPROFILE\Music" | Out-Null
          Copy-Item -Recurse -Force "music\Sori Samples" "$env:USERPROFILE\Music\"
          Start-Process "target\release\sori-app.exe"
          Start-Sleep -Seconds 25
          try { (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:4380/api/library).Content } catch { "서버에 닿지 않음: $_" }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          New-Item -ItemType Directory -Force shots | Out-Null
          $bmp.Save("shots\windows-1.png")
          $small = New-Object System.Drawing.Bitmap $bmp, ([int]($b.Width * 0.75)), ([int]($b.Height * 0.75))
          $small.Save("shots\windows-1.jpg", [System.Drawing.Imaging.ImageFormat]::Jpeg)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-shots
          path: shots
          if-no-files-found: ignore
      - name: 화면을 로그로
        if: always()
        shell: bash
        run: |
          mkdir -p logshots
          cp shots/*.jpg logshots/ 2>/dev/null || true
          python ci/print-shots.py logshots

  android:
    name: 안드로이드 앱
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: 빌드 시각
        run: echo "SORI_BUILD_TIME=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - name: 화면
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund
          npx vite build
      - name: NDK
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - name: 안드로이드 프로젝트
        working-directory: crates/sori-app
        run: npm run tauri -- android init --ci
      - run: python3 ci/android-patch.py crates/sori-app/gen/android
      - name: APK
        working-directory: crates/sori-app
        run: npm run tauri -- android build --apk --target aarch64 --target x86_64 --ci
      - name: 서명
        env:
          # 저장소 비밀값에 배포용 키가 있으면 그것으로, 없으면 저장소의 개발용 키로 서명한다.
          # 키가 빌드마다 같아야 새 APK를 지우지 않고 덮어 설치할 수 있다.
          KEYSTORE_B64: ${{ secrets.SORI_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.SORI_KEYSTORE_PASS }}
        run: |
          APK=$(find crates/sori-app/gen/android/app/build/outputs/apk -name '*release*.apk' | head -1)
          echo "APK: $APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > sori.jks
            PASS="$KEYSTORE_PASS"
          else
            cp ci/sori-dev.jks sori.jks
            PASS=sori-dev-key
          fi
          "$BT/zipalign" -p -f 4 "$APK" aligned.apk
          "$BT/apksigner" sign --ks sori.jks --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --out Sori.apk aligned.apk
          "$BT/apksigner" verify --print-certs Sori.apk | head -3
          ls -la Sori.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Sori-android
          path: Sori.apk

  release:
    name: 내려받기 (sori-latest)
    runs-on: ubuntu-latest
    needs: [windows, android]
    if: github.event_name == 'push' && github.ref == 'refs/heads/sori'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Sori-android
          path: dist/android
      - uses: actions/download-artifact@v4
        with:
          name: Sori-windows
          path: dist/windows
      - name: 미리 보기 릴리스를 새로 만든다
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          mkdir -p up
          cp dist/android/Sori.apk up/Sori-android.apk
          find dist/windows -name '*-setup.exe' -exec cp {} up/ \;
          find dist/windows -name '*.msi' -exec cp {} up/ \;
          # 앱의 자동 업데이트가 보는 것: 빌드, 시각, 파일별 주소·크기·SHA-256
          BUILD_TIME=$(git log -1 --format=%ct) python3 ci/latest-json.py up > latest.json
          mv latest.json up/
          cat up/latest.json
          ls -la up
          cat > notes.md <<NOTES
          \`sori\` 브랜치의 최신 빌드 (${GITHUB_SHA::7}). 커밋마다 새로 만들어진다.

          - **안드로이드**: 휴대폰에서 \`Sori-android.apk\`를 내려받아 설치한다(설정에서 이 출처의 앱 설치를 허용).
            PC나 서버 없이 휴대폰 안에서 라이브러리를 읽고 직접 튼다. 처음 열 때 음악 파일 권한을 허용한다.
          - **윈도우**: \`*-setup.exe\`(또는 \`.msi\`)로 설치한다.
          NOTES
          gh release delete sori-latest --yes --cleanup-tag || true
          gh release create sori-latest up/* --prerelease --target "$GITHUB_SHA" --title "소리 최신 빌드" --notes-file notes.md

  android-screens:
    name: 안드로이드 화면 (에뮬레이터)
    runs-on: ubuntu-latest
    needs: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Sori-android
      - uses: actions/download-artifact@v4
        with:
          name: sample-music
          path: music
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        continue-on-error: true
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash ci/android-screens.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-shots
          path: shots
          if-no-files-found: ignore
      - name: 화면을 로그로
        if: always()
        run: |
          python3 -m venv /tmp/shots-venv
          /tmp/shots-venv/bin/pip install --quiet pillow
          /tmp/shots-venv/bin/python ci/print-shots.py shots --width 540
