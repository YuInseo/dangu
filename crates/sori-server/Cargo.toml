[package]
name = "sori-server"
description = "소리 서버: 라이브러리 API, 원본 그대로 스트리밍, 플레이어 원격 조종, 화면"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "sori"
path = "src/main.rs"

[features]
default = []
# 이 기기의 오디오 장치로 직접 트는 존(네이티브 존)
device = ["sori-core/device"]

[dependencies]
sori-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
parking_lot.workspace = true
tracing.workspace = true
tokio.workspace = true
axum = "0.8.9"
tower-http = { version = "0.7.1", features = ["compression-gzip", "compression-br"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rust-embed = { version = "8.13", features = ["mime-guess"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
httpdate = "1"

[dev-dependencies]
tempfile = "3"
