[package]
name = "sori-server"
description = "소리 서버: 라이브러리 API, 원본 그대로 스트리밍, 플레이어 원격 조종, 화면"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "sori"
path = "src/main.rs"

[features]
default = []
# 이 기기의 오디오 장치로 직접 트는 존(네이티브 존)
device = ["sori-core/device"]

[dependencies]
sori-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
parking_lot.workspace = true
tracing.workspace = true
tokio.workspace = true
axum = { version = "0.8.9", features = ["multipart"] }
tower-http = { version = "0.7.1", features = ["compression-gzip", "compression-br"] }
tokio-util = { version = "0.7", features = ["io"] }
# 같은 와이파이의 다른 기기와 잇기(선택): 이 기기의 LAN 주소
if-addrs = "0.15"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rust-embed = { version = "8.13", features = ["mime-guess"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
httpdate = "1"
# 자동 업데이트: 릴리스의 latest.json과 설치 파일을 받는다
ureq = "3.4.2"

[dev-dependencies]
form_urlencoded = "1.2"
tempfile = "3"
sha1 = "0.10"
hound = "3.5"
