[package]
name = "sori-app"
description = "소리 앱: 윈도우와 안드로이드에서 서버를 품고 화면을 띄운다"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.90"

[lib]
# 안드로이드는 cdylib, 데스크톱은 rlib을 쓴다.
name = "sori_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "sori-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
sori-core = { workspace = true }
sori-server = { workspace = true, features = ["device"] }
anyhow.workspace = true
tracing.workspace = true
tokio.workspace = true
serde_json.workspace = true
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[features]
default = []
